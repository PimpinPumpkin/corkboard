name: CI

# One channel. A push to main that changes something a user can see is built, tested, signed and
# published as the next release, and that release is the one Obtainium and the download button
# serve. Nothing else is published: no canary, no nightly.
#
# Versions count releases, not builds: the first is 0.1.0 (code 10000), the next 0.1.1 (10001).
on:
  workflow_dispatch:
    inputs:
      force:
        description: Publish a release even if no user-facing change landed since the last one
        type: boolean
        default: false
  push:
    branches: [ main ]
    # Things that provably never reach the APK. Workflow files are NOT ignored on purpose: they
    # change the build itself.
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'licenses/**'
      - '.gitignore'
      - '.github/FUNDING.yml'
      - 'docs/**'
  pull_request:
    branches: [ main ]

permissions:
  contents: write

# Releases are numbered by counting the ones before them, so two builds of main must never run
# at once: a second push waits for the first to finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history and tags: the changelog and the "has main moved" test both need them.
          fetch-depth: 0

      - name: Writing rules (no trailers, US English, no em dashes)
        # The backstop for scripts/install-hooks.sh: commit subjects are printed verbatim as
        # release notes, so a slip fails the build rather than sitting on main.
        run: |
          BEFORE="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "push" ] && [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            bash scripts/check-writing.sh "$BEFORE..$GITHUB_SHA"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            bash scripts/check-writing.sh "origin/${{ github.base_ref }}..HEAD"
          else
            bash scripts/check-writing.sh "HEAD~1..HEAD"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # No emulator: this job only builds and runs JVM tests. The platform is named because
          # the Material 3 Expressive alphas compile against 37, newer than runners ship with.
          packages: platform-tools platforms;android-37.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode release keystore (optional)
        # Without the secret (a fork, say) the APK is debug-signed: fine for testing, but it
        # cannot update an install signed with the real key.
        env:
          KEYSTORE_B64: ${{ secrets.CORKBOARD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/corkboard-release.jks"
            echo "Decoded release keystore."
          else
            echo "No keystore secret: the release APK will be debug-signed."
          fi

      - name: Fetch the Cronet runtime
        # From this repository's own release when it is there (the cronet workflow publishes the
        # versions it packs). Signed in, because an anonymous download fails while the repository
        # is private; without it the build falls back to public sources by itself.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="$(sed -n 's/^corkboard.cronetVersion=//p' gradle.properties)"
          mkdir -p app/libs
          gh release download cronet-runtime -p "cronet-$v.aar" -D app/libs 2>/dev/null || echo "Not on this repository's release; the build will look elsewhere."

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Derive build version
        id: ver
        # The number of releases so far is this release's patch number, and 10000 plus it is its
        # version code: 0.1.0 is 10000, 0.1.1 is 10001. A build that is not published (a pull
        # request, or a push with nothing user-facing in it) gets the number the next release would.
        run: |
          n="$(git tag -l 'v0.1.*' | wc -l | tr -d ' ')"
          last="$(git tag -l 'v0.1.*' --sort=-v:refname | head -n1)"
          echo "name=0.1.$n" >> "$GITHUB_OUTPUT"
          echo "code=$(( 10000 + n ))" >> "$GITHUB_OUTPUT"
          echo "last=$last" >> "$GITHUB_OUTPUT"
          # What a user would read as the change list. Empty means nothing worth a release.
          if [ -n "$last" ]; then log="$(bash scripts/changelog.sh "${last}..HEAD")"; else log="$(bash scripts/changelog.sh -n 30 HEAD)"; fi
          { echo "log<<CHANGELOG_END"; echo "$log"; echo "CHANGELOG_END"; } >> "$GITHUB_OUTPUT"

      - name: Write the What's new notes
        # What changed in this release, and only that: the same lines as the release notes. They
        # ride inside the APK so the app never has to ask a server what changed.
        env:
          LOG: ${{ steps.ver.outputs.log }}
        run: |
          mkdir -p app/src/main/assets
          printf '%s\n' "$LOG" > app/src/main/assets/whatsnew.txt
          cat app/src/main/assets/whatsnew.txt

      - name: Build release APK
        env:
          CORKBOARD_KEYSTORE_PATH: ${{ runner.temp }}/corkboard-release.jks
          CORKBOARD_KEYSTORE_PASSWORD: ${{ secrets.CORKBOARD_KEYSTORE_PASSWORD }}
          CORKBOARD_KEY_ALIAS: ${{ secrets.CORKBOARD_KEY_ALIAS }}
        run: >
          ./gradlew :app:assembleRelease --no-daemon
          -PappVersionName=${{ steps.ver.outputs.name }}
          -PappVersionCode=${{ steps.ver.outputs.code }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: corkboard-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish the release
        # Only from main, and only when there is something to tell users about (or when asked).
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (steps.ver.outputs.log != '' || github.event.inputs.force == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          LOG: ${{ steps.ver.outputs.log }}
        run: |
          VER="${{ steps.ver.outputs.name }}"
          LAST="${{ steps.ver.outputs.last }}"
          cp app/build/outputs/apk/release/app-release.apk "corkboard-v${VER}.apk"
          [ -z "$LOG" ] && LOG="- Maintenance and internal changes"
          if [ -n "$LAST" ]; then COMPARE="**Full changelog:** https://github.com/${{ github.repository }}/compare/${LAST}...v${VER}"; else COMPARE=""; fi
          NOTES="$(printf 'What'\''s changed in %s\n\n%s\n\n%s\n' "$VER" "$LOG" "$COMPARE")"
          gh release create "v${VER}" --title "Corkboard $VER" --target "$GITHUB_SHA" --latest --notes "$NOTES" "corkboard-v${VER}.apk"
