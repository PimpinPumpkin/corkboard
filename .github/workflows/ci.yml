name: CI

# Three channels, the same arrangement as Vela and Sotto.
#
#   canary   every push to the `canary` branch replaces the one APK on the rolling `canary` release.
#   nightly  a daily cron cuts a v0.2.<run> PRERELEASE from main, only if main moved since the last.
#   stable   promote-stable.yml flips the newest nightly to a full release once a week. Same APK,
#            no rebuild.
#
# A push to main builds and tests only; the APK rides as a workflow artifact. Pushes never mint
# releases, so a burst of commits cannot spam the release page.
on:
  schedule:
    - cron: '30 10 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Cut a nightly even if main has not moved since the last one
        type: boolean
        default: false
  push:
    branches: [ main, canary ]
    # Things that provably never reach the APK. Workflow files are NOT ignored on purpose: they
    # change the build itself.
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'licenses/**'
      - '.gitignore'
      - '.github/FUNDING.yml'
  pull_request:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history and tags: the changelog and the "has main moved" test both need them.
          fetch-depth: 0

      - name: Writing rules (no trailers, US English, no em dashes)
        # The backstop for scripts/install-hooks.sh: commit subjects are printed verbatim as
        # release notes, so a slip fails the build rather than sitting on main.
        run: |
          BEFORE="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "push" ] && [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            bash scripts/check-writing.sh "$BEFORE..$GITHUB_SHA"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            bash scripts/check-writing.sh "origin/${{ github.base_ref }}..HEAD"
          else
            bash scripts/check-writing.sh "HEAD~1..HEAD"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # No emulator: this job only builds and runs JVM tests. The platform is named because
          # the Material 3 Expressive alphas compile against 37, newer than runners ship with.
          packages: platform-tools platforms;android-37.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode release keystore (optional)
        # Without the secret (a fork, say) the APK is debug-signed: fine for testing, but it
        # cannot update an install signed with the real key.
        env:
          KEYSTORE_B64: ${{ secrets.CORKBOARD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/corkboard-release.jks"
            echo "Decoded release keystore."
          else
            echo "No keystore secret: the release APK will be debug-signed."
          fi

      - name: Fetch the Cronet runtime
        # From this repository's own release when it is there (the cronet workflow publishes the
        # versions it packs). Signed in, because an anonymous download fails while the repository
        # is private; without it the build falls back to public sources by itself.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="$(sed -n 's/^corkboard.cronetVersion=//p' gradle.properties)"
          mkdir -p app/libs
          gh release download cronet-runtime -p "cronet-$v.aar" -D app/libs 2>/dev/null || echo "Not on this repository's release; the build will look elsewhere."

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Derive build version
        id: ver
        # One rising line for every channel (1000 + run), so moving between canary, nightly and
        # stable is always a plain upgrade. Only the NAME says which channel a build came from.
        run: |
          if [ "${{ github.ref }}" = "refs/heads/canary" ]; then
            echo "name=0.2.${{ github.run_number }}-canary" >> "$GITHUB_OUTPUT"
          else
            echo "name=0.2.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi
          echo "code=$(( 2000 + ${{ github.run_number }} ))" >> "$GITHUB_OUTPUT"

      - name: Write the What's new notes
        # The last dozen user-facing changes ride inside the APK, so the app never has to ask a
        # server what changed.
        run: |
          mkdir -p app/src/main/assets
          bash scripts/changelog.sh -n 12 HEAD > app/src/main/assets/whatsnew.txt
          cat app/src/main/assets/whatsnew.txt

      - name: Build release APK
        env:
          CORKBOARD_KEYSTORE_PATH: ${{ runner.temp }}/corkboard-release.jks
          CORKBOARD_KEYSTORE_PASSWORD: ${{ secrets.CORKBOARD_KEYSTORE_PASSWORD }}
          CORKBOARD_KEY_ALIAS: ${{ secrets.CORKBOARD_KEY_ALIAS }}
        run: >
          ./gradlew :app:assembleRelease --no-daemon
          -PappVersionName=${{ steps.ver.outputs.name }}
          -PappVersionCode=${{ steps.ver.outputs.code }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: corkboard-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish canary build (rolling release)
        # Recreated on every push rather than edited, so it sorts to the top of the release page
        # and its tag follows the pushed commit. The download URL never changes.
        # Also on a manual run of the canary branch: that is how the cronet workflow, whose own
        # pushes cannot start a build, gets its update published.
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/canary'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${{ steps.ver.outputs.name }}"
          CODE="${{ steps.ver.outputs.code }}"
          cp app/build/outputs/apk/release/app-release.apk corkboard-canary.apk
          SUBJ="$(bash scripts/changelog.sh --latest HEAD)"
          [ -z "$SUBJ" ] && SUBJ="$(git log -1 --no-merges --pretty=%s)"
          NOTES="$(printf 'Canary branch.\n\nversionName: %s\nversionCode: %s\n\nLatest change: %s\n' "$VER" "$CODE" "$SUBJ")"
          gh release delete canary --yes --cleanup-tag 2>/dev/null || true
          gh release create canary --prerelease --target "$GITHUB_SHA" --title "Corkboard $VER" --notes "$NOTES" corkboard-canary.apk

      - name: Publish nightly (prerelease)
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST="$(git tag -l 'v0.[0-9]*' --sort=-v:refname | head -n1)"
          if [ -n "$LAST" ] && \
             [ "$(git rev-parse "${LAST}^{commit}")" = "$(git rev-parse HEAD)" ] && \
             [ "${{ github.event.inputs.force || 'false' }}" != "true" ]; then
            echo "main has not moved since $LAST: no nightly today."
            exit 0
          fi
          VER="${{ steps.ver.outputs.name }}"
          cp app/build/outputs/apk/release/app-release.apk "corkboard-v${VER}.apk"
          # Commit subjects are written as plain changelog lines, so this reads as release notes.
          if [ -n "$LAST" ]; then
            LOG="$(bash scripts/changelog.sh "${LAST}..HEAD")"
            COMPARE="**Full changelog:** https://github.com/${{ github.repository }}/compare/${LAST}...v${VER}"
          else
            LOG="$(bash scripts/changelog.sh -n 20 HEAD)"
            COMPARE=""
          fi
          [ -z "$LOG" ] && LOG="- Maintenance and internal changes"
          NOTES="$(printf 'Nightly build.\n\nWhat'\''s changed in %s\n\n%s\n\n%s\n' "$VER" "$LOG" "$COMPARE")"
          gh release create "v${VER}" \
            --title "Corkboard $VER nightly" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --notes "$NOTES" \
            "corkboard-v${VER}.apk"

      - name: Prune old nightlies (stables are kept for good)
        # Thirty nightlies is a month of bisect range. The v0.* filter is load bearing: `canary`
        # is a prerelease too and must never be swept up here.
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate 'repos/${{ github.repository }}/releases?per_page=100' \
            --jq '.[] | select(.tag_name | test("^v0\\.")) | "\(.created_at)\t\(.prerelease)\t\(.tag_name)"' \
            | sort -r > /tmp/app-releases.txt
          awk -F'\t' '$2=="true"{print $3}' /tmp/app-releases.txt | tail -n +31 > /tmp/doomed.txt
          echo "keeping every stable; pruning $(wc -l < /tmp/doomed.txt) old nightlies"
          while read -r tag; do
            [ -n "$tag" ] || continue
            gh release delete "$tag" --yes --cleanup-tag || true
          done < /tmp/doomed.txt
